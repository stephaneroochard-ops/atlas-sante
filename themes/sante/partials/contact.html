<section class="contact-section" data-section="contact"><div class="section-wrap contact-section__grid"><div><p class="eyebrow">Un contact simple</p><h2 data-field="contact.email">Préparez votre demande.</h2><p class="contact-section__lead">Laissez vos coordonnées et le motif de votre visite. Le cabinet vous répondra pour confirmer les prochaines étapes.</p><form class="contact-form" action="contact.html" method="get"><label for="name">Nom complet</label><input id="name" name="name" autocomplete="name" required><label for="phone">Téléphone</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" dir="ltr" required><label for="message">Motif de votre visite</label><textarea id="message" name="message" rows="4" required></textarea><button class="button button--primary" type="submit">Envoyer ma demande</button></form></div><aside class="contact-card"><p class="eyebrow">Venir au cabinet</p><strong data-field="contact.address.city">Adresse du cabinet</strong><p data-field="contact.address.street">Adresse à renseigner par le cabinet avant publication.</p><a class="text-link" href="https://www.google.com/maps" rel="noopener">Préparer mon itinéraire</a></aside></div></section>
